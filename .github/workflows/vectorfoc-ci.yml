name: VectorFOC CI

on:
  push:
    paths:
      - "**"
  pull_request:
    paths:
      - "**"

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vector-mt6816
            board_xstar: "OFF"
            sensor: MT6816
          - name: vector-tmr3109
            board_xstar: "OFF"
            sensor: TMR3109
          - name: xstar-hall
            board_xstar: "ON"
            sensor: HALL
          - name: xstar-abz
            board_xstar: "ON"
            sensor: ABZ
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake make python3

      - name: Configure ${{ matrix.name }}
        run: |
          cmake -S . -B "build-${{ matrix.name }}" \
            -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DBOARD_XSTAR=${{ matrix.board_xstar }} \
            -DPOSITION_SENSOR=${{ matrix.sensor }}

      - name: Build ${{ matrix.name }}
        run: cmake --build "build-${{ matrix.name }}" -j2

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.name }}
          path: |
            build-${{ matrix.name }}/VectorFoc.elf
            build-${{ matrix.name }}/VectorFoc.bin
            build-${{ matrix.name }}/VectorFoc.hex
          retention-days: 30

  bootloader:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake make

      - name: Configure bootloader
        run: |
          cmake -S . -B build-bootloader \
            -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DBOOTLOADER_BUILD=ON

      - name: Build bootloader
        run: cmake --build build-bootloader -j2

      - name: Upload bootloader
        uses: actions/upload-artifact@v4
        with:
          name: firmware-bootloader
          path: |
            build-bootloader/VectorFoc_Bootloader.elf
            build-bootloader/VectorFoc_Bootloader.bin
            build-bootloader/VectorFoc_Bootloader.hex
          retention-days: 30

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make gcc python3

      - name: Configure host tests
        run: |
          cmake -S test -B test/build-ci

      - name: Build host tests
        run: cmake --build test/build-ci -j2

      - name: Run C tests
        run: ctest --test-dir test/build-ci --output-on-failure

      - name: Run app-header and OTA tooling tests
        run: python3 -m unittest discover -s test -p "test_app_header_tools.py" -v

  host-tests-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure host tests
        run: cmake -S test -B test/build-ci-msvc -A x64

      - name: Build host tests
        run: cmake --build test/build-ci-msvc --config Debug --parallel

      - name: Run C tests
        run: ctest --test-dir test/build-ci-msvc -C Debug --output-on-failure

      - name: Run app-header and OTA tooling tests
        run: python -m unittest discover -s test -p "test_app_header_tools.py" -v
